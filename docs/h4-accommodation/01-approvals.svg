,810" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/><polyline points="900,855 900,930" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="900,1060 900,1140" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="1735,550 1760,550 1760,875 1735,875" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="1145,790 1295,855" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="1145,990 1220,990 1220,930 1295,930" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="1295,820 1245,820 1245,375 1145,375" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/><polyline points="1735,600 1782,600 1782,1175 1735,1175" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="8 7"/><polyline points="1145,1020 1210,1020 1210,1175 1295,1175" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)"/><polyline points="1145,840 1180,865 1180,1210 1295,1210" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="8 7"/><rect x="60" y="55" width="55" height="55" rx="12" fill="#244a76"/><text x="87" y="91" text-anchor="middle" font-size="25" font-weight="700" fill="white">01</text><text x="135" y="80" font-size="30" font-weight="700" fill="#182d42">Creation, faculty recommendation &amp; approval</text><text x="135" y="108" font-size="17" fill="#61768a">Confirmed: IIT requester/faculty email · external intern email allowed · no extra HoD approval</text><g><rect x="655" y="150" width="490" height="115" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="185.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Institutional requester signs in</text><text x="900.0" y="216.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">IIT student / staff / Academics user</text><text x="900.0" y="243.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Requester email must be @iiti.ac.in</text><text x="665" y="140" fill="#213e60" font-size="13" font-weight="700">CREATOR</text></g><g><rect x="655" y="310" width="490" height="140" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="344.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Batch: one request per student</text><text x="900.0" y="375.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Identity / institute / course / contact / stay</text><text x="900.0" y="402.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Concerned faculty; payer = intern / faculty</text><text x="900.0" y="429.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Validate every row; retry-safe submission</text><text x="665" y="300" fill="#213e60" font-size="13" font-weight="700">CREATOR</text></g><polygon points="900,475.0 1070.0,550 900,625.0 730.0,550" fill="#fff8e9" stroke="#b78b43" stroke-width="2"/><text x="900" y="530" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">Academics user is</text><text x="900" y="556" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">the selected faculty</text><text x="900" y="582" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">&amp; submits directly?</text><g><rect x="65" y="485" width="440" height="135" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="285.0" y="516.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Record faculty recommendation</text><text x="285.0" y="547.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Own faculty selection; submit-and-</text><text x="285.0" y="574.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">recommend</text><text x="285.0" y="601.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Confirm details, stay and payer</text><text x="75" y="475" fill="#1e5844" font-size="13" font-weight="700">ACADEMICS</text></g><rect x="595.2" y="514" width="49.599999999999994" height="29" rx="6" fill="white"/><text x="620" y="535" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Yes</text><g><rect x="1295" y="480" width="440" height="145" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="1515.0" y="516.5" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Selected Academics user reviews</text><text x="1515.0" y="547.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">role = Academics; @iiti.ac.in email</text><text x="1515.0" y="574.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Recommend selected / return / decline</text><text x="1515.0" y="601.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Verify who pays for each student</text><text x="1305" y="470" fill="#213e60" font-size="13" font-weight="700">ACADEMICS</text></g><rect x="1090.8" y="514" width="178.39999999999998" height="29" rx="6" fill="white"/><text x="1180" y="535" text-anchor="middle" font-size="16" fill="#6885a3" font-weight="600">No: other creator</text><g><rect x="655" y="720" width="490" height="135" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="751.5" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Check accommodation feasibility</text><text x="900.0" y="782.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Review dates, hostel options &amp; room conflicts</text><text x="900.0" y="809.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Recommend / return / reject per student</text><text x="900.0" y="836.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">No empty-room threshold blocks H4</text><text x="665" y="710" fill="#213e60" font-size="13" font-weight="700">CW OFFICE</text></g><rect x="423.2" y="639" width="233.6" height="29" rx="6" fill="white"/><text x="540" y="660" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Recommendation recorded</text><rect x="1170.2" y="654" width="279.59999999999997" height="29" rx="6" fill="white"/><text x="1310" y="675" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Recommended + payer verified</text><g><rect x="65" y="750" width="440" height="130" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="285.0" y="779.0" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">All rooms can be considered</text><text x="285.0" y="810.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Resident allocation ≠ physical presence</text><text x="285.0" y="837.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Guest/intern overlap stays advisory</text><text x="285.0" y="864.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Occupancy does not hard-block H4</text></g><rect x="509.2" y="771" width="141.6" height="29" rx="6" fill="white"/><text x="580" y="792" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Room evidence</text><g><rect x="655" y="930" width="490" height="130" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="959.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Chief Warden decides</text><text x="900.0" y="990.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Approve / return / reject per student</text><text x="900.0" y="1017.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Faculty and CW Office decisions visible</text><text x="900.0" y="1044.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Explicit approval; no H4 auto-timeout</text><text x="665" y="920" fill="#213e60" font-size="13" font-weight="700">CHIEF WARDEN</text></g><rect x="797.0" y="876" width="206.0" height="29" rx="6" fill="white"/><text x="900" y="897" text-anchor="middle" font-size="16" fill="#6885a3" font-weight="600">CW Office recommends</text><g><rect x="655" y="1140" width="490" height="115" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="1175.0" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Approved → prepare the offer</text><text x="900.0" y="1206.0" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Continue to flow 02</text><text x="900.0" y="1233.0" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">No repeated faculty approval in the normal path</text></g><rect x="856.8" y="1080" width="86.39999999999999" height="29" rx="6" fill="white"/><text x="900" y="1101" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Approve</text><g><rect x="1295" y="795" width="440" height="165" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="1515.0" y="828.0" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">Return for correction</text><text x="1515.0" y="859.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Creator updates only affected requests</text><text x="1515.0" y="886.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Increment version; revoke old links</text><text x="1515.0" y="913.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Re-enter earliest invalidated approval</text><text x="1515.0" y="940.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Identity / stay / purpose / payer changes</text></g><rect x="1701.4" y="704" width="77.19999999999999" height="29" rx="6" fill="white"/><text x="1740" y="725" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Return</text><rect x="1171.4" y="789" width="77.19999999999999" height="29" rx="6" fill="white"/><text x="1210" y="810" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Return</text><rect x="1179.4" y="941" width="77.19999999999999" height="29" rx="6" fill="white"/><text x="1218" y="962" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Return</text><rect x="1140.8" y="404" width="178.39999999999998" height="29" rx="6" fill="white"/><text x="1230" y="425" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Revise &amp; resubmit</text><g><rect x="1295" y="1110" width="440" height="135" rx="13" fill="#fbecec" stroke="#bb6262" stroke-width="2"/><text x="1515.0" y="1141.5" text-anchor="middle" fill="#893838" font-size="22" font-weight="700">Rejected / declined student</text><text x="1515.0" y="1172.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Reason is recorded; this child stops</text><text x="1515.0" y="1199.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Other students in the batch can continue</text><text x="1515.0" y="1226.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">History is retained</text></g><rect x="1711.8" y="1034" width="86.39999999999999" height="29" rx="6" fill="white"/><text x="1755" y="1055" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">Decline</text><rect x="1166.4" y="1074" width="77.19999999999999" height="29" rx="6" fill="white"/><text x="1205" y="1095" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">Reject</text><rect x="1089.6" y="1174" width="150.79999999999998" height="29" rx="6" fill="white"/><text x="1165" y="1195" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">Office rejects</text><text x="70" y="1303" font-size="16" fill="#61768a">All Academics users are eligible. Only the selected faculty recommends. Group rows by student / creator / faculty / batch.</text></g></svg>