<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1760" viewBox="0 0 1800 1760" role="img" aria-labelledby="diagram-title"><title id="diagram-title">Typed room assignment &amp; live warning overrides</title><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#6885a3"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#438568"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#b86b6b"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#ba924c"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1800" height="1760" fill="#ffffff"/><rect x="32" y="28" width="1736" height="1704" rx="20" fill="#fff" stroke="#d8e2ec" stroke-width="2"/><polyline points="900,260 900,310" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="900,445 900,470" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="1075,550 1300,550" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)"/><polyline points="1510,475 1510,365 1150,365" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="8 7"/><polyline points="900,630 900,680" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="500,770 590,770" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/><polyline points="900,845 900,875" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="740,950 515,950" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="1060,950 1300,950" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="1725,915 1760,915 1760,410 1150,410" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/><polyline points="295,1030 295,1110 790,1110 790,1150" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="1510,1065 1510,1110 1010,1110 1010,1150" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="900,1290 900,1310" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="1075,1390 1300,1390" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="1510,1310 1510,1180 1250,1180 1250,800 1210,800" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/><polyline points="900,1470 900,1530" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><rect x="60" y="55" width="55" height="55" rx="12" fill="#244a76"/><text x="87" y="91" text-anchor="middle" font-size="25" font-weight="700" fill="white">03</text><text x="135" y="80" font-size="30" font-weight="700" fill="#182d42">Typed room assignment &amp; live warning overrides</text><text x="135" y="108" font-size="17" fill="#61768a">Any real room in authorized hostel scope can be reviewed. Occupancy warnings are advisory, not prohibitions.</text><g><rect x="650" y="155" width="500" height="105" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="185.0" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Ready for room assignment</text><text x="900.0" y="216.0" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Payment verified + hostel allotted</text><text x="900.0" y="243.0" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Supervisor is authorized for this hostel</text><text x="660" y="145" fill="#1e5844" font-size="13" font-weight="700">SUPERVISOR</text></g><g><rect x="650" y="310" width="500" height="135" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="341.5" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Enter hostel / unit / room number</text><text x="900.0" y="372.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Use normal input — no all-room dropdown</text><text x="900.0" y="399.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Stay window uses approved dates and times</text><text x="900.0" y="426.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Press Check room / Enter</text><text x="660" y="300" fill="#213e60" font-size="13" font-weight="700">SUPERVISOR</text></g><polygon points="900,470.0 1075.0,550 900,630.0 725.0,550" fill="#fff8e9" stroke="#b78b43" stroke-width="2"/><text x="900" y="543" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">Valid room, dates</text><text x="900" y="569" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">and authority?</text><g><rect x="1300" y="475" width="420" height="160" rx="13" fill="#fbecec" stroke="#bb6262" stroke-width="2"/><text x="1510.0" y="503.5" text-anchor="middle" fill="#893838" font-size="22" font-weight="700">Correct the input /</text><text x="1510.0" y="534.5" text-anchor="middle" fill="#893838" font-size="22" font-weight="700">authorization</text><text x="1510.0" y="565.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Unknown or ambiguous room</text><text x="1510.0" y="592.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Outside assigned hostel scope</text><text x="1510.0" y="619.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Invalid dates or request not ready</text></g><rect x="1164.8" y="513" width="40.4" height="29" rx="6" fill="white"/><text x="1185" y="534" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">No</text><rect x="1207.4" y="325" width="215.2" height="29" rx="6" fill="white"/><text x="1315" y="346" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">Correct &amp; check again</text><g><rect x="590" y="680" width="620" height="165" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="713.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Build live room warnings</text><text x="900.0" y="744.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Current resident allocations; presence may be unknown</text><text x="900.0" y="771.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Overlapping H2 + legacy visitor + H4 reservations</text><text x="900.0" y="798.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Room status / nominal capacity / placement issues</text><text x="900.0" y="825.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Exclude this request; honor early/late stay times</text><text x="600" y="670" fill="#213e60" font-size="13" font-weight="700">SERVER</text></g><rect x="875.2" y="634" width="49.599999999999994" height="29" rx="6" fill="white"/><text x="900" y="655" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Yes</text><g><rect x="65" y="675" width="435" height="190" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="282.5" y="720.5" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">Holiday / resident room evidence</text><text x="282.5" y="751.5" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Show who is assigned to the room</text><text x="282.5" y="778.5" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Do not infer absence from summer holidays</text><text x="282.5" y="805.5" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Current allocations have no dated absence</text><text x="282.5" y="832.5" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Never remove the resident allocation</text></g><rect x="500.2" y="727" width="95.6" height="29" rx="6" fill="white"/><text x="548" y="748" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Evidence</text><polygon points="900,875.0 1060.0,950 900,1025.0 740.0,950" fill="#fff8e9" stroke="#b78b43" stroke-width="2"/><text x="900" y="943" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">Any warnings</text><text x="900" y="969" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">for this stay?</text><g><rect x="80" y="900" width="435" height="130" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="297.5" y="942.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">No recorded conflicts</text><text x="297.5" y="973.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Room is selectable</text><text x="297.5" y="1000.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Proceed to live save-time recheck</text></g><rect x="604.8" y="912" width="40.4" height="29" rx="6" fill="white"/><text x="625" y="933" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">No</text><g><rect x="1300" y="860" width="425" height="205" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="1512.5" y="913.0" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">Review warnings → choose action</text><text x="1512.5" y="944.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Proceed: acknowledge + explain override</text><text x="1512.5" y="971.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">OR choose another room and check again</text><text x="1512.5" y="998.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Resident / guest overlap never blocks H4</text><text x="1512.5" y="1025.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Override retains both reservations</text><text x="1310" y="850" fill="#805019" font-size="13" font-weight="700">SUPERVISOR</text></g><rect x="1155.2" y="912" width="49.599999999999994" height="29" rx="6" fill="white"/><text x="1180" y="933" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Yes</text><rect x="1516.6" y="654" width="196.79999999999998" height="29" rx="6" fill="white"/><text x="1615" y="675" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Choose another room</text><g><rect x="650" y="1150" width="500" height="140" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="1184.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Recheck under shared room lock</text><text x="900.0" y="1215.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Read current conflicts immediately before saving</text><text x="900.0" y="1242.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Compare warning fingerprint + request version</text><text x="900.0" y="1269.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">H2 / legacy assignments use the same room lock</text><text x="660" y="1140" fill="#213e60" font-size="13" font-weight="700">SERVER</text></g><rect x="1190.2" y="1075" width="279.59999999999997" height="29" rx="6" fill="white"/><text x="1330" y="1096" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Proceed with acknowledgement</text><polygon points="900,1310.0 1075.0,1390 900,1470.0 725.0,1390" fill="#fff8e9" stroke="#b78b43" stroke-width="2"/><text x="900" y="1383" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">Preview still current</text><text x="900" y="1409" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">and acknowledged?</text><g><rect x="1300" y="1310" width="425" height="170" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="1512.5" y="1343.5" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">Conditions changed → review</text><text x="1512.5" y="1374.5" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">again</text><text x="1512.5" y="1405.5" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Return refreshed warnings</text><text x="1512.5" y="1432.5" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Do not silently save a stale override</text><text x="1512.5" y="1459.5" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Intentional overlap is still allowed</text></g><rect x="1159.8" y="1353" width="40.4" height="29" rx="6" fill="white"/><text x="1180" y="1374" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">No</text><rect x="1240.0" y="1144" width="160.0" height="29" rx="6" fill="white"/><text x="1320" y="1165" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Refresh preview</text><g><rect x="610" y="1530" width="580" height="150" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="1555.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Save dated reservation + override audit</text><text x="900.0" y="1586.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Actor, time, warnings and reason saved atomically</text><text x="900.0" y="1613.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Leave resident allocation / occupancy / capacity / status</text><text x="900.0" y="1640.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">intact</text><text x="900.0" y="1667.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Notify intern of the room → continue to flow 04</text><text x="620" y="1520" fill="#1e5844" font-size="13" font-weight="700">SERVER + SUPERVISOR</text></g><rect x="875.2" y="1478" width="49.599999999999994" height="29" rx="6" fill="white"/><text x="900" y="1499" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Yes</text><text x="70" y="1713" font-size="16" fill="#61768a">Normal H2/legacy guest booking remains restrictive and checks H4 reservations. H4 never flips a resident room to Guest or reactivates it.</text></g></svg>