<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1730" viewBox="0 0 1800 1730" role="img" aria-labelledby="diagram-title"><title id="diagram-title">Arrival, stay changes, close-out &amp; payer invoice</title><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#6885a3"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#438568"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#b86b6b"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#ba924c"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1800" height="1730" fill="#ffffff"/><rect x="32" y="28" width="1736" height="1674" rx="20" fill="#fff" stroke="#d8e2ec" stroke-width="2"/><polyline points="900,265 900,315" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="900,425 900,490" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="650,550 500,550" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="285,700 285,750 560,750 560,590 650,590" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/><polyline points="1150,550 1300,550" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)"/><polyline points="900,615 900,705" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="900,820 900,875" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="1510,655 1510,940 1190,940" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="8 7"/><polyline points="900,1010 900,1050" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="710,1135 500,1135" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)"/><polyline points="285,1250 285,1290 620,1290 620,1165 777,1165" fill="none" stroke="#ba924c" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-amber)" stroke-dasharray="8 7"/><polyline points="900,1220 900,1310" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="790,1420 790,1450 370,1450 370,1485" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><polyline points="1010,1420 1010,1450 1430,1450 1430,1485" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><rect x="60" y="55" width="55" height="55" rx="12" fill="#244a76"/><text x="87" y="91" text-anchor="middle" font-size="25" font-weight="700" fill="white">04</text><text x="135" y="80" font-size="30" font-weight="700" fill="#182d42">Arrival, stay changes, close-out &amp; payer invoice</text><text x="135" y="108" font-size="17" fill="#61768a">One student can arrive, extend, move, cancel or settle independently of the rest of the submission batch.</text><g><rect x="650" y="155" width="500" height="110" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="187.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Room assigned → arrival information</text><text x="900.0" y="218.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Intern receives hostel / unit / room</text><text x="900.0" y="245.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Gate and supervisor see a scoped arrival roster</text></g><g><rect x="650" y="315" width="500" height="110" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="347.5" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Check in the individual student</text><text x="900.0" y="378.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Gate / authorized supervisor</text><text x="900.0" y="405.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Store actual arrival when recorded</text><text x="660" y="305" fill="#213e60" font-size="13" font-weight="700">GATE / SUPERVISOR</text></g><g><rect x="650" y="490" width="500" height="125" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="530.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Stay in progress</text><text x="900.0" y="561.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Per-student room and stay timeline</text><text x="900.0" y="588.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Payment state remains separately visible</text><text x="660" y="480" fill="#213e60" font-size="13" font-weight="700">SUPERVISOR</text></g><g><rect x="65" y="465" width="435" height="235" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="282.5" y="490.5" text-anchor="middle" fill="#805019" font-size="19" font-weight="700">Extension / postponement / room</text><text x="282.5" y="518.5" text-anchor="middle" fill="#805019" font-size="19" font-weight="700">move</text><text x="282.5" y="546.5" text-anchor="middle" fill="#805019" font-size="15" font-weight="400">CW Office reviews date changes</text><text x="282.5" y="570.5" text-anchor="middle" fill="#805019" font-size="15" font-weight="400">Rerun conflicts over the new stay window</text><text x="282.5" y="594.5" text-anchor="middle" fill="#805019" font-size="15" font-weight="400">Material changes re-review affected</text><text x="282.5" y="618.5" text-anchor="middle" fill="#805019" font-size="15" font-weight="400">approvals</text><text x="282.5" y="642.5" text-anchor="middle" fill="#805019" font-size="15" font-weight="400">Extra charge → payment verification as</text><text x="282.5" y="666.5" text-anchor="middle" fill="#805019" font-size="15" font-weight="400">required</text><text x="282.5" y="690.5" text-anchor="middle" fill="#805019" font-size="15" font-weight="400">Room move → repeat flow 03 for new room</text></g><rect x="485.4" y="512" width="169.2" height="29" rx="6" fill="white"/><text x="570" y="533" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Change requested</text><rect x="252.20000000000002" y="713" width="325.59999999999997" height="29" rx="6" fill="white"/><text x="415" y="734" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Approved update / conflict review</text><g><rect x="1300" y="465" width="425" height="190" rx="13" fill="#fbecec" stroke="#bb6262" stroke-width="2"/><text x="1512.5" y="510.5" text-anchor="middle" fill="#893838" font-size="22" font-weight="700">Cancellation / confirmed no-show</text><text x="1512.5" y="541.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Office records reason and decision</text><text x="1512.5" y="568.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Close only this student’s reservation</text><text x="1512.5" y="595.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Retain payment history</text><text x="1512.5" y="622.5" text-anchor="middle" fill="#893838" font-size="18" font-weight="400">Refund handling stays manual</text></g><rect x="1145.0" y="512" width="160.0" height="29" rx="6" fill="white"/><text x="1225" y="533" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">Office decision</text><g><rect x="650" y="705" width="500" height="115" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="730.5" text-anchor="middle" fill="#213e60" font-size="20" font-weight="700">Check out / confirmed stay closure</text><text x="900.0" y="759.5" text-anchor="middle" fill="#213e60" font-size="16" font-weight="400">Record actual departure where available</text><text x="900.0" y="784.5" text-anchor="middle" fill="#213e60" font-size="16" font-weight="400">Scheduled stay end uses the agreed close-out</text><text x="900.0" y="809.5" text-anchor="middle" fill="#213e60" font-size="16" font-weight="400">policy</text><text x="660" y="695" fill="#213e60" font-size="13" font-weight="700">GATE / OFFICE</text></g><g><rect x="610" y="875" width="580" height="135" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="906.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Release only the H4 dated reservation</text><text x="900.0" y="937.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Release does not wait for invoice generation</text><text x="900.0" y="964.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Resident allocation and room status remain unchanged</text><text x="900.0" y="991.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Outstanding money remains on the student’s request</text></g><rect x="1190.4" y="902" width="399.2" height="29" rx="6" fill="white"/><text x="1390" y="923" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">End reservation; retain financial history</text><polygon points="900,1050.0 1090.0,1135 900,1220.0 710.0,1135" fill="#fff8e9" stroke="#b78b43" stroke-width="2"/><text x="900" y="1128" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">Stay closed and all</text><text x="900" y="1154" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">required payments settled?</text><g><rect x="65" y="1055" width="435" height="195" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="282.5" y="1103.0" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">Balance / proof remains pending</text><text x="282.5" y="1134.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Keep request available for settlement</text><text x="282.5" y="1161.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Payer submits / corrects proof</text><text x="282.5" y="1188.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Accountant verifies</text><text x="282.5" y="1215.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Reservation is already released</text></g><rect x="584.8" y="1097" width="40.4" height="29" rx="6" fill="white"/><text x="605" y="1118" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">No</text><rect x="382.4" y="1252" width="215.2" height="29" rx="6" fill="white"/><text x="490" y="1273" text-anchor="middle" font-size="16" fill="#ba924c" font-weight="600">Settled → re-evaluate</text><g><rect x="655" y="1310" width="490" height="110" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="1342.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Generate accommodation invoice once</text><text x="900.0" y="1373.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Unique invoice number + frozen bill-to identity</text><text x="900.0" y="1400.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Keep issued document history</text><text x="665" y="1300" fill="#1e5844" font-size="13" font-weight="700">ACCOUNTANT / JOB</text></g><rect x="875.2" y="1244" width="49.599999999999994" height="29" rx="6" fill="white"/><text x="900" y="1265" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Yes</text><g><rect x="100" y="1485" width="540" height="145" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="370.0" y="1521.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Payer was the intern</text><text x="370.0" y="1552.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Invoice raised in the intern’s name</text><text x="370.0" y="1579.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Deliver to that intern’s permitted email / access</text><text x="370.0" y="1606.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">link</text></g><g><rect x="1160" y="1485" width="540" height="145" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="1430.0" y="1521.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Payer was faculty</text><text x="1430.0" y="1552.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Invoice raised in verified faculty’s name</text><text x="1430.0" y="1579.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Deliver to faculty; creator is not the bill-to</text><text x="1430.0" y="1606.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">identity</text></g><rect x="551.4" y="1412" width="77.19999999999999" height="29" rx="6" fill="white"/><text x="590" y="1433" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Intern</text><rect x="1176.8" y="1412" width="86.39999999999999" height="29" rx="6" fill="white"/><text x="1220" y="1433" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Faculty</text><g><rect x="1300" y="1050" width="425" height="175" rx="13" fill="#f5f7fa" stroke="#bac8d4" stroke-width="2"/><text x="1512.5" y="1101.5" text-anchor="middle" fill="#31465b" font-size="22" font-weight="700">Mess remains separate</text><text x="1512.5" y="1132.5" text-anchor="middle" fill="#31465b" font-size="18" font-weight="400">With / without preference is recorded</text><text x="1512.5" y="1159.5" text-anchor="middle" fill="#31465b" font-size="18" font-weight="400">Dining roster can be shared as authorized</text><text x="1512.5" y="1186.5" text-anchor="middle" fill="#31465b" font-size="18" font-weight="400">No food invoice through this portal</text></g><text x="70" y="1683" font-size="16" fill="#61768a">Invoice recipient is the verified payer. Cancellation never claims an automatic refund. Payment history remains accessible after the stay ends.</text></g></svg>