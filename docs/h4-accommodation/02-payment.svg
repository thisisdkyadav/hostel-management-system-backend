<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1350" viewBox="0 0 1800 1350" role="img" aria-labelledby="diagram-title"><title id="diagram-title">Offer, payer access &amp; payment verification</title><defs><marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#6885a3"/></marker><marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#438568"/></marker><marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#b86b6b"/></marker><marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8 Z" fill="#ba924c"/></marker></defs><g font-family="DejaVu Sans, Arial, sans-serif"><rect width="1800" height="1350" fill="#ffffff"/><rect x="32" y="28" width="1736" height="1294" rx="20" fill="#fff" stroke="#d8e2ec" stroke-width="2"/><polyline points="900,255 900,300" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="590,375 500,375" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="900,470 900,510" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="740,585 530,585" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="1060,585 1270,585" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="308,700 308,750 790,750 790,785" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="1492,700 1492,750 1010,750 1010,785" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="900,915 900,950" fill="none" stroke="#6885a3" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-blue)"/><polyline points="730,1030 510,1030" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)"/><polyline points="285,960 285,850 655,850" fill="none" stroke="#b86b6b" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)" stroke-dasharray="8 7"/><polyline points="900,1110 900,1170" fill="none" stroke="#438568" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-green)"/><rect x="60" y="55" width="55" height="55" rx="12" fill="#244a76"/><text x="87" y="91" text-anchor="middle" font-size="25" font-weight="700" fill="white">02</text><text x="135" y="80" font-size="30" font-weight="700" fill="#182d42">Offer, payer access &amp; payment verification</text><text x="135" y="108" font-size="17" fill="#61768a">CW Office sets the offer; faculty-verified payer identity travels into payment and the invoice</text><g><rect x="655" y="155" width="490" height="100" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="196.0" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Chief Warden approved</text><text x="900.0" y="227.0" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">From flow 01</text></g><g><rect x="590" y="300" width="620" height="170" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="349.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">CW Office issues the student offer</text><text x="900.0" y="380.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Confirm dates, hostel and accommodation charge</text><text x="900.0" y="407.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Mess: with / without; no food charge invoice</text><text x="900.0" y="434.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Confirm verified payer; freeze offer + bill-to snapshot</text><text x="600" y="290" fill="#213e60" font-size="13" font-weight="700">CW OFFICE</text></g><g><rect x="65" y="325" width="435" height="140" rx="13" fill="#f5f7fa" stroke="#bac8d4" stroke-width="2"/><text x="282.5" y="359.0" text-anchor="middle" fill="#31465b" font-size="22" font-weight="700">Intern receives stay information</text><text x="282.5" y="390.0" text-anchor="middle" fill="#31465b" font-size="18" font-weight="400">Email every intern; external email allowed</text><text x="282.5" y="417.0" text-anchor="middle" fill="#31465b" font-size="18" font-weight="400">Dates / hostel / charge / mess preference</text><text x="282.5" y="444.0" text-anchor="middle" fill="#31465b" font-size="18" font-weight="400">Scoped updates to creator and faculty</text></g><rect x="217.0" y="284" width="206.0" height="29" rx="6" fill="white"/><text x="320" y="305" text-anchor="middle" font-size="16" fill="#6885a3" font-weight="600">Always notify intern</text><polygon points="900,510.0 1060.0,585 900,660.0 740.0,585" fill="#fff8e9" stroke="#b78b43" stroke-width="2"/><text x="900" y="578" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">Who is the</text><text x="900" y="604" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">verified payer?</text><g><rect x="85" y="525" width="445" height="175" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="307.5" y="576.5" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Intern pays</text><text x="307.5" y="607.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Send intern-scoped expiring access link</text><text x="307.5" y="634.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Show offer; upload UTR / date / screenshot</text><text x="307.5" y="661.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Bill-to identity = this intern</text><text x="95" y="515" fill="#213e60" font-size="13" font-weight="700">INTERN / STUDENT</text></g><g><rect x="1270" y="525" width="445" height="175" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="1492.5" y="576.5" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Faculty pays</text><text x="1492.5" y="607.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Faculty uses authorized view / secure link</text><text x="1492.5" y="634.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Submit payment proof for this student</text><text x="1492.5" y="661.5" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Bill-to identity = verified faculty</text><text x="1280" y="515" fill="#213e60" font-size="13" font-weight="700">FACULTY PAYER</text></g><rect x="596.4" y="547" width="77.19999999999999" height="29" rx="6" fill="white"/><text x="635" y="568" text-anchor="middle" font-size="16" fill="#6885a3" font-weight="600">Intern</text><rect x="1126.8" y="547" width="86.39999999999999" height="29" rx="6" fill="white"/><text x="1170" y="568" text-anchor="middle" font-size="16" fill="#6885a3" font-weight="600">Faculty</text><g><rect x="655" y="785" width="490" height="130" rx="13" fill="#edf3fb" stroke="#3c658f" stroke-width="2"/><text x="900.0" y="814.0" text-anchor="middle" fill="#213e60" font-size="22" font-weight="700">Payment proof submitted</text><text x="900.0" y="845.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Keep creator, resident and payer distinct</text><text x="900.0" y="872.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">UTR + paid-on date + screenshot</text><text x="900.0" y="899.0" text-anchor="middle" fill="#213e60" font-size="18" font-weight="400">Proof cannot verify itself</text><text x="665" y="775" fill="#213e60" font-size="13" font-weight="700">PAYER</text></g><polygon points="900,950.0 1070.0,1030 900,1110.0 730.0,1030" fill="#fff8e9" stroke="#b78b43" stroke-width="2"/><text x="900" y="1023" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">Accountant verifies</text><text x="900" y="1049" text-anchor="middle" font-size="19" font-weight="600" fill="#77531d">payment proof?</text><g><rect x="65" y="960" width="445" height="150" rx="13" fill="#fbecec" stroke="#bb6262" stroke-width="2"/><text x="287.5" y="986.0" text-anchor="middle" fill="#893838" font-size="21" font-weight="700">Proof rejected → correct &amp;</text><text x="287.5" y="1016.0" text-anchor="middle" fill="#893838" font-size="21" font-weight="700">resubmit</text><text x="287.5" y="1046.0" text-anchor="middle" fill="#893838" font-size="17" font-weight="400">Accountant records the reason</text><text x="287.5" y="1072.0" text-anchor="middle" fill="#893838" font-size="17" font-weight="400">Named payer receives correction request</text><text x="287.5" y="1098.0" text-anchor="middle" fill="#893838" font-size="17" font-weight="400">Room assignment waits for verification</text></g><rect x="599.8" y="994" width="40.4" height="29" rx="6" fill="white"/><text x="620" y="1015" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">No</text><rect x="379.6" y="809" width="150.79999999999998" height="29" rx="6" fill="white"/><text x="455" y="830" text-anchor="middle" font-size="16" fill="#b86b6b" font-weight="600">Resubmit proof</text><g><rect x="655" y="1170" width="490" height="105" rx="13" fill="#e8f4ee" stroke="#3e826a" stroke-width="2"/><text x="900.0" y="1213.5" text-anchor="middle" fill="#1e5844" font-size="22" font-weight="700">Payment verified → room assignment</text><text x="900.0" y="1244.5" text-anchor="middle" fill="#1e5844" font-size="18" font-weight="400">Continue to flow 03</text></g><rect x="875.2" y="1123" width="49.599999999999994" height="29" rx="6" fill="white"/><text x="900" y="1144" text-anchor="middle" font-size="16" fill="#438568" font-weight="600">Yes</text><g><rect x="1270" y="950" width="445" height="170" rx="13" fill="#fff4df" stroke="#bc8a3d" stroke-width="2"/><text x="1492.5" y="999.0" text-anchor="middle" fill="#805019" font-size="22" font-weight="700">Pay-later choice (if offered)</text><text x="1492.5" y="1030.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Does not unlock rooms under current rules</text><text x="1492.5" y="1057.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">Faculty undertaking exception needs an</text><text x="1492.5" y="1084.0" text-anchor="middle" fill="#805019" font-size="18" font-weight="400">explicitly agreed H4 policy</text></g><text x="70" y="1303" font-size="16" fill="#61768a">One student = one bill in version one. A shared faculty transfer needs an allocation ledger; never credit it in full to every child.</text></g></svg>